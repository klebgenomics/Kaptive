name: Central Database CI/CD Pipeline

on:
  workflow_call: # This tells GitHub this workflow can be called by other repos
  workflow_dispatch: # This allows the workflow to be triggered manually from the GitHub Actions tab

jobs:
  auto-version-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Caller Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get Changed Files
        id: changed-files
        uses: tj-actions/changed-files@v46
        with:
          files: |
            *.gbk
            *.toml

      - name: Install uv
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: astral-sh/setup-uv@v5

      - name: Fetch Versioning Script
        if: steps.changed-files.outputs.any_changed == 'true'
        run: curl -O https://raw.githubusercontent.com/klebgenomics/Kaptive/refs/heads/master/scripts/bump_db_version.py

      - name: Bump TOMLs, Generate Changelog, and Tag
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          MSG="${{ github.event.head_commit.message }}"
          
          if [[ "$MSG" == *"[major]"* ]] || [[ "$MSG" == *"major:"* ]]; then
            BUMP="major"
          elif [[ "$MSG" == *"[minor]"* ]] || [[ "$MSG" == *"minor:"* ]]; then
            BUMP="minor"
          elif [[ "$MSG" == *"[patch]"* ]] || [[ "$MSG" == *"patch:"* ]]; then
            BUMP="patch"
          else
            echo "No version bump prefix found in commit message. Skipping bump and release."
            exit 0
          fi
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          BUMPED_DBS=""
          
          for file in ${{ steps.changed-files.outputs.all_changed_files }}; do
            DB_NAME=$(basename "$file" | cut -d. -f1)
            TOML_FILE="${DB_NAME}.toml"
            CHANGELOG_FILE="${DB_NAME}_CHANGELOG.md"
            
            if [[ -f "$TOML_FILE" ]] && [[ ! "$BUMPED_DBS" == *"$DB_NAME"* ]]; then
            
              # 1. Bump the TOML version using uv run
              NEW_VER=$(uv run bump_db_version.py "$TOML_FILE" "$BUMP")
              echo "Bumped $DB_NAME to v$NEW_VER"
              
              # 2. CHANGELOG GENERATION
              LAST_TAG=$(git describe --tags --match "${DB_NAME}-v*" --abbrev=0 2>/dev/null || echo "")
              
              if [ -z "$LAST_TAG" ]; then
                LOGS=$(git log --pretty=format:"* %s (%h)" -- ${DB_NAME}.*)
              else
                LOGS=$(git log ${LAST_TAG}..HEAD --pretty=format:"* %s (%h)" -- ${DB_NAME}.*)
              fi
              
              DATE=$(date +%Y-%m-%d)
              ENTRY="## [v${NEW_VER}] - ${DATE}\n${LOGS}"
              
              if [ -f "$CHANGELOG_FILE" ]; then
                # Remove the existing title header to prevent duplicates
                grep -v "^# Changelog: ${DB_NAME}" "$CHANGELOG_FILE" > tmp_changelog || true
                
                # Rebuild the file with the header strictly at the top
                echo "# Changelog: ${DB_NAME}" > "$CHANGELOG_FILE"
                echo "" >> "$CHANGELOG_FILE"
                echo -e "$ENTRY" >> "$CHANGELOG_FILE"
                echo "" >> "$CHANGELOG_FILE"
                
                # Append the old entries, stripping any leading blank lines to prevent gap build-up
                awk 'NF {p=1} p' tmp_changelog >> "$CHANGELOG_FILE"
                rm tmp_changelog
              else
                echo -e "# Changelog: ${DB_NAME}\n\n$ENTRY\n" > "$CHANGELOG_FILE"
              fi
              
              # 3. Stage the files and create the tag
              git add "$TOML_FILE" "$CHANGELOG_FILE"
              BUMPED_DBS="$BUMPED_DBS $DB_NAME"
              git tag "${DB_NAME}-v${NEW_VER}"
            fi
          done
          
          # 4. Commit and Push everything
          if [[ -n $(git status -s) ]]; then
            git commit -m "chore: auto-bump and update changelogs [skip ci]"
            git push origin main
            git push --tags
          fi
