site_name = "Kaptive Documentation"
repo_url = "https://github.com/klebgenomics/Kaptive"
site_url = "https://klebgenomics.github.io/Kaptive"
site_description = "The tool for _in silico_ serotyping"
site_author = "Tom Stanton"
edit_uri = "edit/main/docs/"
repo_name = "klebgenomics/Kaptive"
copyright = "2026, Tom Stanton, Kathryn Holt and Kelly Wyres"
watch = ["zensical.toml", "README.md", "src"]

nav = [
  { Home = "index.md" },
  { Installation = "Installation.md" },
  { Usage = "Usage.md" },
  { Method = "Method.md" },
  { Outputs = "Outputs.md" },
  { "Interpreting the Results" = "Interpreting-the-results.md" },
  { Databases = "Databases.md" },
  { FAQs = "FAQs.md" }
]

plugins = [
  "search",
  { mkdocstrings = { handlers = { python = { options = { docstring_style = "google" } } } } },
  { api-autonav = { modules = ["src/kaptive"], nav_section_title = "API Reference" } },
  "include-markdown",
  "offline"
]

extra_css = [
  "stylesheets/extra.css"
]

markdown_extensions = [
  { toc = { permalink = true, title = "On this page" } },
  { "pymdownx.arithmatex" = { generic = true } },
  "admonition",
  "footnotes"
]

[theme]
name = "material"
logo = "assets/logo.png"
favicon = "assets/favicon.png"
features = [
  "navigation.tabs",
  "toc.follow",
  "content.action.edit",
  "toc.integrate"
]

# Palette toggle for light mode
[[theme.palette]]
scheme = "custom"

[theme.palette.toggle]
icon = "material/brightness-7"
name = "Switch to dark mode"

# Palette toggle for dark mode
[[theme.palette]]
scheme = "custom"

[theme.palette.toggle]
icon = "material/brightness-4"
name = "Switch to light mode"

[[extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/klebgenomics/Kaptive"

[[extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/kaptive"