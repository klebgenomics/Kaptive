[project]
name = "kaptive"
authors = [{ name = "Tom Stanton", email = "tomdstanton@gmail.com" }]
description = "The tool for _in silico_ serotyping"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
dynamic = ["version"]
keywords = ["bioinformatics", "genomics", "serotyping", "microbiology"]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2.4",
    "numba>=0.62",
    "rammappy>=0.1.3",
    "gb-io>=0.4",
]

[project.optional-dependencies]
plot = ["plotly"]
json = ["orjson"]
bgc = ["pyfgs"]
train = ["scikit-learn"]
all = ["kaptive[plot,json,bgc,train]"]

[dependency-groups]
docs = [
    "kaptive[plot,json]",
    "zensical",
    "mkdocstrings[python]",
    "deepl>=1.20",
]
dev = [
    "kaptive[all]",
    { include-group = "docs" },
]

[project.urls]
Homepage = "https://klebgenomics.github.io/Kaptive/"
Repository = "https://github.com/klebgenomics/Kaptive"
Documentation = "https://klebgenomics.github.io/Kaptive/"
"Bug Tracker" = "https://github.com/klebgenomics/Kaptive/issues"
Changelog = "https://github.com/klebgenomics/Kaptive/blob/master/CHANGELOG.md"

[project.scripts]
kaptive = "kaptive.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/kaptive/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kaptive"]

[tool.ruff]
line-length = 120
exclude = [".agents", ".git", ".venv", "__pycache__", "src/kaptive/_version.py"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D"]
extend-select = ["ANN", "PYI"]
preview = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN", "E501"]
"scripts/*" = ["D", "ANN", "E501", "UP031"]
"src/kaptive/db/cli.py" = ["D400"]
"src/kaptive/serotyping/cli.py" = ["D400", "ANN401"]
"src/kaptive/core/alignment.py" = ["D401"]
"src/kaptive/db/core.py" = ["E501", "D401", "UP037"]
"src/kaptive/compare.py" = ["E501", "ANN401"]
"src/kaptive/plotting.py" = ["E501", "ANN401", "ANN202", "ANN001"]
"src/kaptive/serotyping/models.py" = ["E501", "D105", "ANN401"]
"src/kaptive/cli.py" = ["ANN401", "PYI036"]
"src/kaptive/client.py" = ["ANN401"]
"src/kaptive/core/genome.py" = ["ANN401", "PYI036"]
"src/kaptive/core/interval.py" = ["ANN401"]
"src/kaptive/core/kmers.py" = ["ANN401"]
"src/kaptive/core/pairwise.py" = ["ANN401"]
"src/kaptive/db/manager.py" = ["ANN202"]
"src/kaptive/db/models.py" = ["ANN401"]

[tool.ty.rules]
missing-type-argument = "error"
possibly-unresolved-reference = "warn"

[tool.karva.profile.default.coverage]
branch = true