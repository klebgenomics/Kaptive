[project]
name = "kaptive"
authors = [{name="Tom Stanton", email="tomdstanton@gmail.com"}]
description = "The tool for _in silico_ serotyping"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "numpy>=2.4",
    "numba>=0.62",
    "mappy>=2.3",
    "gb-io>=0.4"
]
keywords = ["bioinformatics", "serotyping", "microbiology"]
license = {file = "LICENSE"}
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.scripts]
kaptive = "kaptive.cli:main"

[project.optional-dependencies]
plot = ["matplotlib", "plotly"]
orf = [
    "pyfgs",
#    "pyhmmer>=0.12.0"
]
#build = ["kaptive[prot]", "scipy", "scikit-learn"]

[project.urls]
Homepage = "https://klebgenomics.github.io/Kaptive/"
Repository = "https://github.com/klebgenomics/Kaptive"
Documentation = "https://klebgenomics.github.io/Kaptive/"

[dependency-groups]
test = ["pytest>=9.0.0"]
docs = ["zensical", "mkdocstrings-python"]
dev = [
    "kaptive[orf,plot]",
    "marimo",
    "pandas",
    {include-group = "test"},
    {include-group = "docs"}
]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/kaptive/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kaptive"]

[tool.pytest.ini_options]
addopts = "--doctest-modules"
testpaths = ["tests", "src"]
