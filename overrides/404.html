    <title>404 - Sequence Not Found | Kaptive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2b7a78;
            --secondary-color: #3aafa9;
            --bg-color: #f6f6f6;
            --text-color: #17252a;
        }
        body {
            font-family: 'Varela Round', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
            position: relative;
        }
        .logo {
            max-width: 250px;
            margin-bottom: 2rem;
            z-index: 10;
        }
        .error-container {
            z-index: 10;
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 90%;
        }
        h1 {
            font-size: 2.5rem;
            color: var(--primary-color);
            margin-top: 0;
            margin-bottom: 0.5rem;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 2.5rem;
            color: #555;
            line-height: 1.6;
        }
        .btn {
            background-color: var(--primary-color);
            color: white;
            padding: 12px 28px;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
            display: inline-block;
        }
        .btn:hover {
            background-color: var(--secondary-color);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(58, 175, 169, 0.4);
        }
        
        /* Floating Bacteria Animation */
        .bacteria {
            position: absolute;
            background-color: var(--secondary-color);
            border-radius: 50px;
            opacity: 0.15;
            z-index: 1;
            animation: float 15s infinite ease-in-out;
        }
        .bac-1 { width: 60px; height: 120px; left: 15%; top: 20%; animation-delay: 0s; }
        .bac-2 { width: 40px; height: 80px; right: 20%; top: 15%; animation-delay: -5s; transform: rotate(45deg); }
        .bac-3 { width: 50px; height: 100px; left: 25%; bottom: 20%; animation-delay: -10s; transform: rotate(-30deg); }
        .bac-4 { width: 80px; height: 160px; right: 15%; bottom: 15%; animation-delay: -2s; transform: rotate(15deg); }
        .bac-5 { width: 30px; height: 60px; left: 50%; top: 10%; animation-delay: -7s; transform: rotate(80deg); }
        .bac-6 { width: 45px; height: 90px; right: 40%; bottom: 10%; animation-delay: -4s; transform: rotate(-60deg); }
        
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-30px) rotate(10deg); }
            66% { transform: translateY(20px) rotate(-10deg); }
        }
    </style>
</head>
